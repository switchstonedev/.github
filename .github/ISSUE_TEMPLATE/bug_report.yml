name: Bug Report
description: Report unexpected behavior, crashes, or incorrect benchmark outputs
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please search existing open and closed issues before submitting to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe the problem encountered.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide minimal, reproducible steps or code to trigger the behavior.
      placeholder: |
        1. Run command '...'
        2. With configuration '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
      placeholder: Expected ... but received ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Relevant OS, runtime/compiler version, hardware, and dataset size details where applicable.
      placeholder: |
        - OS: (e.g., Ubuntu 24.04, macOS 14, Windows 11)
        - Runtime / Compiler: (e.g., Python 3.12, Rust 1.80, Go 1.23)
        - Hardware: (e.g., CPU, RAM, GPU if applicable)
        - Dataset / Input Size: (e.g., 100k vectors, 128-dim)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any terminal logs, stack traces, or compiler diagnostics here.
      render: shell
      placeholder: Paste terminal output or stack traces here.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and verified this is not a duplicate report.
          required: true
        - label: I have verified this behavior on the latest release or main branch.
          required: false
