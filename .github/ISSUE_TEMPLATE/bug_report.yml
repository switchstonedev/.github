name: Bug Report
description: File a bug report
labels: ["bug", "triage"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug, including details regarding any error messages, version, and platform.
      description: Please include what you expected vs. what actually occurred.
      placeholder: |
        - Description:
        - Version / Commit hash:
        - Platform / OS:
        - Expected behavior:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce & Minimal Example
      description: Provide minimal, reproducible steps, code snippet, or dataset configuration to trigger the behavior.
      placeholder: |
        1. Run command '...'
        2. With configuration / dataset '...'
        3. See error or unexpected output
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component(s)
      description: Select the SwitchStone component(s) relevant to this bug report.
      multiple: true
      options:
        - Benchmarking Engine
        - Vector DB Benchmark
        - CP Recommendation Engine
        - Developer Tools
        - Algorithms / Data Structures
        - Documentation
        - Continuous Integration / Build
        - C++
        - Python
        - Rust
        - Go
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any terminal logs, stack traces, or compiler diagnostics here.
      render: shell
      placeholder: Paste terminal output or stack traces here.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and verified this is not a duplicate.
          required: true
        - label: I have verified this behavior on the latest release or main branch.
          required: false
