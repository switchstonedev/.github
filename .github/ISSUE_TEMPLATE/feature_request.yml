name: Enhancement Request
description: Request an enhancement or new capability for the project
labels: ["enhancement", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to share your feedback on ways SwitchStone can be improved!
  - type: textarea
    id: description
    attributes:
      label: Describe the enhancement requested
      description: A clear and concise description of the new feature, performance improvement, or benchmark workload.
      placeholder: Describe the problem and the proposed enhancement.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale & Use Cases
      description: Why should this be added to SwitchStone? What use cases or workloads does it support?
      placeholder: Explain the motivation and advantages over existing solutions.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component(s)
      description: Select the SwitchStone component(s) relevant to this enhancement request.
      multiple: true
      options:
        - Benchmarking Engine
        - Vector DB Benchmark
        - CP Recommendation Engine
        - Developer Tools
        - Algorithms / Data Structures
        - Documentation
        - Continuous Integration / Build
        - C++
        - Python
        - Rust
        - Go
        - Other
    validations:
      required: true
