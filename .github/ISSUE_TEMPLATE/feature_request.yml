name: Feature Request
description: Propose a new capability, performance improvement, or benchmark workload
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an enhancement to SwitchStone tooling and systems.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is this feature request related to a specific limitation or pain point?
      placeholder: A clear and concise description of the limitation or problem.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or workflow you would like to see implemented.
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions, trade-offs, or workarounds you considered.
      placeholder: Alternative approaches or libraries evaluated.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any relevant architectural diagrams, benchmark targets, or references.
      placeholder: Links, citations, or sample schemas.
    validations:
      required: false
